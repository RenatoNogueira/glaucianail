<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark"><meta name="theme-color" content="#c2456f">
<title>Sem conexão</title>
<style>
  :root{--bg:#fbf6f4;--ink:#2d1f2b;--muted:#7d6b76;--rose:#c2456f;--blush:#f8e3ea}
  @media (prefers-color-scheme:dark){:root{--bg:#17101a;--ink:#f3e9ee;--muted:#b3a2ad;--rose:#e8688f;--blush:#3b2230}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,Segoe UI,Roboto,sans-serif;text-align:center}
  .ic{display:grid;place-items:center;width:84px;height:84px;margin:0 auto 18px;border-radius:50%;background:var(--blush);font-size:2.4rem}
  h1{margin:0 0 8px;font-size:1.5rem}p{margin:0 auto 22px;max-width:28em;color:var(--muted)}
  button{border:0;border-radius:999px;padding:13px 26px;background:var(--rose);color:#fff;font:inherit;font-weight:600;cursor:pointer}
</style></head><body>
<main><div class="ic">📡</div><h1>Você está sem internet</h1>
<p>Para agendar é preciso estar conectada. Verifique sua conexão e tente novamente.</p>
<button id="retry">Tentar novamente</button></main>
<script src="/offline.js"></script>
</body></html>
